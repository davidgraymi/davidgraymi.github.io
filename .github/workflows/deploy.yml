name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check site
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Check links and security.txt
        run: npm run check:site

      # Compare against the live site's manifest now, before the deploy replaces it.
      - name: List pages changed since the last deploy (IndexNow)
        run: node scripts/indexnow.mjs diff indexnow-urls.txt

      - name: Upload IndexNow URL list
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.txt

      - name: List posts to share (LinkedIn)
        run: node scripts/linkedin.mjs diff linkedin-posts.json

      - name: Upload LinkedIn post list
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-posts
          path: linkedin-posts.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Notify search engines (IndexNow)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download IndexNow URL list
        uses: actions/download-artifact@v4
        with:
          name: indexnow-urls

      - name: Submit changed URLs
        run: node scripts/indexnow.mjs submit indexnow-urls.txt

  linkedin:
    name: Share new posts on LinkedIn
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download LinkedIn post list
        uses: actions/download-artifact@v4
        with:
          name: linkedin-posts

      # Skips when the secrets aren't set; fails when the token has expired.
      - name: Share new posts
        run: node scripts/linkedin.mjs post linkedin-posts.json
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR: ${{ secrets.LINKEDIN_AUTHOR }}
