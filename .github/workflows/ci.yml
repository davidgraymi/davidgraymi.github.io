name: Validate

on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check site
        run: npm run check

      - name: Model artifacts match models.lock.json
        run: npm run models -- verify

      - name: Build site
        run: npm run build

      - name: Upload built site for the browser checks
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

      - name: Check links and security.txt
        run: npm run check:site

      - name: Lighthouse (accessibility, best practices, SEO must pass)
        run: npx --yes @lhci/cli@0.15 autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/reports
          if-no-files-found: ignore

  browsers:
    name: Every page in ${{ matrix.browser }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install ${{ matrix.browser }}
        run: npx playwright-core install --with-deps ${{ matrix.browser }}

      - name: Load every page at desktop and phone sizes
        run: npm run check:browsers -- ${{ matrix.browser }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: .github/screenshots/browsers
          if-no-files-found: ignore
